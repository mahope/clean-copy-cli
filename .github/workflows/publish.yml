name: Publish

# Publishes to npm and creates the GitHub release when a version tag is pushed:
#   npm run release -- patch      # npm version + git push --follow-tags
#
# Needs the NPM_TOKEN repository secret (npm granular access token, read/write
# on the @mahope scope, bypass 2FA). Provenance is attached via GitHub OIDC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test
        run: npm test --if-present

      - name: Refuse to publish if the tag does not match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match package.json version $version"
              exit 1
            fi
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes
          fi
