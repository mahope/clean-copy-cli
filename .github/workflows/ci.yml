name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      - name: Smoke test CLI
        run: |
          echo '<h1>Hello</h1><p>World with   messy&nbsp;spacing</p>' | node clean-copy.js -q | grep -q 'World'
          node clean-copy.js --help >/dev/null

  test-action:
    runs-on: ubuntu-latest
    name: Test GitHub Action (URL to Markdown)
    steps:
      - uses: actions/checkout@v4
      - name: Convert example.com to Markdown
        id: clean-copy
        uses: ./
        with:
          url: 'https://example.com/'
      - name: Verify output
        run: |
          printf '%s\n' "${{ steps.clean-copy.outputs.markdown }}" | grep -q 'Example Domain' || (echo 'FAIL: "Example Domain" not found'; exit 1)
          echo "✅ URL action test passed"
      - name: Test plain mode
        id: clean-copy-plain
        uses: ./
        with:
          url: 'https://example.com/'
          mode: 'plain'
      - name: Verify plain output
        run: |
          printf '%s\n' "${{ steps.clean-copy-plain.outputs.markdown }}" | grep -q 'Example Domain' || (echo 'FAIL: plain mode failed'; exit 1)
          echo "✅ Plain mode test passed"

      - name: Test wikilinks mode
        id: clean-copy-wikilinks
        uses: ./
        with:
          html: '<p>See <a href="/docs/page">the docs page</a>.</p>'
          mode: 'wikilinks'
      - name: Verify wikilinks output
        run: |
          printf '%s\n' "${{ steps.clean-copy-wikilinks.outputs.markdown }}" | grep -q '\[\[the docs page\]\]' || (echo 'FAIL: wikilinks mode failed'; exit 1)
          echo "✅ Wikilinks mode test passed"

      - name: Test csv mode
        id: clean-copy-csv
        uses: ./
        with:
          html: '<table><tr><th>Name</th></tr><tr><td>value, with comma</td></tr></table>'
          mode: 'csv'
          output_file: '/tmp/out.csv'
      - name: Verify csv output
        run: |
          cat /tmp/out.csv
          grep -q '"value, with comma"' /tmp/out.csv || (echo 'FAIL: csv mode failed'; exit 1)
          echo "✅ CSV mode test passed"

      - name: Test invalid mode fails cleanly
        id: clean-copy-invalid
        uses: ./
        continue-on-error: true
        with:
          html: '<p>x</p>'
          mode: 'bogus'
      - name: Verify invalid mode was rejected
        run: |
          [ "${{ steps.clean-copy-invalid.outcome }}" = "failure" ] || (echo 'FAIL: bogus mode should fail'; exit 1)
          echo "✅ Invalid mode rejected"

  verify-tarball:
    runs-on: ubuntu-latest
    name: Verify release tarball is complete and runnable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: ./tools/make_tarball.sh
      - name: Tarball contents must include core + docs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -tzf "clean-copy-${VERSION}.tar.gz" | tee /tmp/contents.txt
          grep -q clean_copy_core.js /tmp/contents.txt
          grep -q README.md /tmp/contents.txt
          grep -q LICENSE /tmp/contents.txt

  verify-homebrew-sha:
    runs-on: ubuntu-latest
    name: Homebrew formula sha256 must match the release tarball
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check formula version + sha256 against the published release asset
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_URL="https://github.com/mahope/clean-copy-cli/releases/download/v${VERSION}/clean-copy-${VERSION}.tar.gz"
          FORMULA_URL="https://raw.githubusercontent.com/mahope/homebrew-clean-copy/main/Formula/clean-copy.rb"
          curl -fsSL "$FORMULA_URL" -o /tmp/formula.rb || { echo 'FAIL: could not fetch formula'; exit 1; }
          FURL=$(grep -E '^  url ' /tmp/formula.rb | sed 's/.*url "//;s/"$//')
          FSHA=$(grep -E '^  sha256 ' /tmp/formula.rb | sed 's/.*sha256 "//;s/"$//')
          [ "$FURL" = "$EXPECTED_URL" ] || { echo "FAIL: formula url does not point at v${VERSION}: $FURL"; exit 1; }
          curl -fsSL "$FURL" -o /tmp/asset.tar.gz || { echo "FAIL: release asset missing: $FURL"; exit 1; }
          ASHA=$(sha256sum /tmp/asset.tar.gz | cut -d' ' -f1)
          echo "formula sha: $FSHA"
          echo "asset   sha: $ASHA"
          [ "$FSHA" = "$ASHA" ] || { echo 'FAIL: formula sha256 does not match the published release asset'; exit 1; }
          # the asset must contain the runnable CLI
          rm -rf /tmp/ax && mkdir /tmp/ax && tar -xzf /tmp/asset.tar.gz -C /tmp/ax
          grep -q '"version"' /tmp/ax/package.json
          grep -q clean_copy_core <(tar -tzf /tmp/asset.tar.gz)
          echo "✅ Formula matches the published release asset"

  test-file-input:
    runs-on: ubuntu-latest
    name: Test GitHub Action (file input)
    steps:
      - uses: actions/checkout@v4
      - name: Create a test HTML file
        run: |
          cat > /tmp/test.html << 'EOF'
          <html><body><h1>File Input Test</h1><p>This is <b>bold</b> text converted from a file.</p></body></html>
          EOF
      - name: Convert file to Markdown
        id: convert-file
        uses: ./
        with:
          file: /tmp/test.html
      - name: Verify file output
        run: |
          printf '%s\n' "${{ steps.convert-file.outputs.markdown }}" | grep -q 'File Input Test' || (echo 'FAIL: title not found'; exit 1)
          printf '%s\n' "${{ steps.convert-file.outputs.markdown }}" | grep -q 'bold' || (echo 'FAIL: bold not found'; exit 1)
          echo "✅ File input test passed"

  test-html-input:
    runs-on: ubuntu-latest
    name: Test GitHub Action (html input)
    steps:
      - uses: actions/checkout@v4
      - name: Convert raw HTML to Markdown
        id: convert-html
        uses: ./
        with:
          html: '<h1>Raw HTML</h1><ul><li>Item 1</li><li>Item 2</li></ul>'
      - name: Verify html output
        run: |
          printf '%s\n' "${{ steps.convert-html.outputs.markdown }}" | grep -q 'Raw HTML' || (echo 'FAIL: title not found'; exit 1)
          printf '%s\n' "${{ steps.convert-html.outputs.markdown }}" | grep -q 'Item 1' || (echo 'FAIL: list item not found'; exit 1)
          echo "✅ HTML input test passed"

  test-output-file:
    runs-on: ubuntu-latest
    name: Test GitHub Action (output_file)
    steps:
      - uses: actions/checkout@v4
      - name: Convert with output_file
        uses: ./
        with:
          html: '<h1>Output File Test</h1><p>Written to a file.</p>'
          output_file: /tmp/result.md
      - name: Verify output_file
        run: |
          test -f /tmp/result.md || (echo 'FAIL: output file not created'; exit 1)
          grep -q 'Output File Test' /tmp/result.md || (echo 'FAIL: content not found in output file'; exit 1)
          echo "✅ Output file test passed"